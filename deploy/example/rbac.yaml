apiVersion: v1
kind: ServiceAccount
metadata:
  name: volcano-cert-sync
  namespace: cert-sync-example
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: volcano-cert-sync-read-source-tls
  namespace: cert-sync-example
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["source-tls-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: volcano-cert-sync-read-source-tls
  namespace: cert-sync-example
subjects:
  - kind: ServiceAccount
    name: volcano-cert-sync
    namespace: cert-sync-example
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: volcano-cert-sync-read-source-tls
