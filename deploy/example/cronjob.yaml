apiVersion: batch/v1
kind: CronJob
metadata:
  name: volcano-cert-sync
  namespace: cert-sync-example
  labels:
    app.kubernetes.io/name: volcano-cert-sync
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: volcano-cert-sync
        spec:
          serviceAccountName: volcano-cert-sync
          imagePullSecrets:
            - name: registry-credentials
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: registry.example.com/proxy/volcano-cert-sync@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              imagePullPolicy: IfNotPresent
              args: []
              envFrom:
                - secretRef:
                    name: volcano-cert-sync-credentials
                - configMapRef:
                    name: volcano-cert-sync-config
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
